name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Se queda `enablement: true` porque no molesta y cubre el caso de que
      # el sitio se borre, pero conviene saber que la PRIMERA vez no sirve:
      # GitHub no deja crear el sitio de Pages con el token efímero de
      # Actions ni con `pages: write` («Resource not accessible by
      # integration»). Darlo de alta es un clic humano, una sola vez, en
      # Settings → Pages → Source: GitHub Actions. A partir de ahí este
      # workflow publica solo en cada push a main.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
