<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Simulador de vida retrofuturista ambientado en una galaxia muy, muy lejana. Crea tu personaje, elige tu camino y comparte el resumen de tu vida.">
<meta name="theme-color" content="#04070c">
<title>HOLOVIDA — una vida en una galaxia muy, muy lejana</title>
<style>
/* ============================================================
   HOLOVIDA :: estilo retrofuturista
   Terminal holográfica: fósforo cian, ámbar, cromo y art déco.
   ============================================================ */

:root {
  --bg:        #04070c;
  --bg2:       #070d15;
  --panel:     #0a121c;
  --panel2:    #0d1826;
  --linea:     #17334a;
  --cian:      #3ad6ff;
  --cian-tenue:#1d7fa0;
  --ambar:     #ffb03a;
  --oro:       #d8b84a;
  --rojo:      #ff4d5e;
  --verde:     #6aff8a;
  --morado:    #c98aff;
  --txt:       #cfe8f5;
  --txt-dim:   #6f93a8;
  --sombra:    0 0 0 1px #12283a, 0 8px 30px rgba(0,0,0,.75);
  --mono: "SFMono-Regular", "SF Mono", "Roboto Mono", "DejaVu Sans Mono", "Courier New", monospace;
  --disp: "Impact", "Haettenschweiler", "Arial Narrow Bold", "Oswald", sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--txt);
  font-family: var(--mono);
  font-size: 15px;
  line-height: 1.5;
  min-height: 100%;
  -webkit-font-smoothing: antialiased;
}

/* fondo: estrellas + rejilla + viñeta */
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(1px 1px at 12% 22%, #cfe8f5 50%, transparent 51%),
    radial-gradient(1px 1px at 68% 14%, #9fd4ff 50%, transparent 51%),
    radial-gradient(1px 1px at 34% 71%, #ffffff 50%, transparent 51%),
    radial-gradient(1px 1px at 82% 63%, #ffd9a0 50%, transparent 51%),
    radial-gradient(1px 1px at 51% 42%, #cfe8f5 50%, transparent 51%),
    radial-gradient(1px 1px at 24% 88%, #a0ffe0 50%, transparent 51%),
    radial-gradient(1400px 700px at 50% -10%, #0d2438 0%, transparent 70%),
    linear-gradient(#04070c, #060a11);
  opacity: .95;
}
/* líneas de barrido CRT */
body::after {
  content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none;
  background: repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.22) 2px 4px);
  mix-blend-mode: multiply;
}

#app { position: relative; z-index: 1; }

.pantalla { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 22px 14px; }

/* en partida la página no scrollea: scrollean las zonas de dentro */
body.en-juego { overflow: hidden; height: 100dvh; }
body.en-juego #app { height: 100dvh; }

/* ---------- marco CRT ---------- */
.crt-frame {
  position: relative;
  width: 100%; max-width: 560px;
  background: linear-gradient(180deg, var(--panel2), var(--panel));
  border: 1px solid var(--linea);
  border-radius: 4px;
  padding: 28px 26px 22px;
  box-shadow: var(--sombra), inset 0 0 60px rgba(58,214,255,.05);
}
.crt-frame.ancho { max-width: 940px; }
.crt-frame::before {
  content: ""; position: absolute; inset: 6px; pointer-events: none;
  border: 1px solid rgba(58,214,255,.14);
}
.crt-frame::after {
  content: ""; position: absolute; top: 0; left: 24px; right: 24px; height: 2px;
  background: linear-gradient(90deg, transparent, var(--cian), transparent);
  opacity: .55;
}

/* ---------- logotipo ---------- */
.logo { text-align: center; margin-bottom: 26px; }
.logo-sub { font-size: 10px; letter-spacing: .32em; color: var(--cian-tenue); text-transform: uppercase; }
.logo h1 {
  font-family: var(--disp);
  font-size: clamp(46px, 12vw, 84px);
  letter-spacing: .06em; margin: 6px 0 2px; line-height: .95;
  color: var(--ambar);
  text-shadow: 0 0 18px rgba(255,176,58,.35), 3px 3px 0 #7a3d00;
}
.logo h1 span { color: var(--cian); text-shadow: 0 0 18px rgba(58,214,255,.45), 3px 3px 0 #04374a; }
.logo-line { height: 3px; background: linear-gradient(90deg, transparent, var(--oro), transparent); margin: 8px 0; }
.logo-tag { font-size: 11px; letter-spacing: .18em; color: var(--txt-dim); text-transform: uppercase; }

.menu-inicio { display: grid; gap: 10px; margin-bottom: 24px; }

/* ---------- botones ---------- */
.btn {
  font-family: var(--mono); font-size: 13px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--cian); background: linear-gradient(180deg, #0e2233, #091724);
  border: 1px solid var(--cian-tenue); border-radius: 2px;
  padding: 11px 16px; cursor: pointer; text-align: left;
  transition: all .12s ease;
  position: relative;
}
.btn:hover { background: linear-gradient(180deg, #14364d, #0c2233); color: #fff; border-color: var(--cian); box-shadow: 0 0 16px rgba(58,214,255,.25); }
.btn:active { transform: translateY(1px); }
.btn.grande { font-size: 15px; padding: 14px 18px; color: var(--ambar); border-color: #7a5a1a; background: linear-gradient(180deg, #2a1d06, #1a1204); }
.btn.grande:hover { color: #fff; border-color: var(--ambar); box-shadow: 0 0 20px rgba(255,176,58,.3); }
.btn.fantasma { background: transparent; border-color: #24404f; color: var(--txt-dim); }
.btn.fantasma:hover { color: var(--txt); border-color: var(--cian-tenue); box-shadow: none; }
.btn.peligro { color: var(--rojo); border-color: #6a2028; background: linear-gradient(180deg,#240a0e,#170609); }
.btn.mini { padding: 5px 9px; font-size: 11px; letter-spacing: .08em; }
.btn.bloque { display: block; width: 100%; text-align: center; margin-top: 8px; }
button:disabled, .act.off { opacity: .35; cursor: not-allowed; }

/* ---------- métricas de portada ---------- */
.metricas {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
  background: var(--linea); border: 1px solid var(--linea); margin-bottom: 16px;
}
.metricas div { background: var(--panel); padding: 10px 8px; text-align: center; }
.metricas b { display: block; font-size: 17px; color: var(--ambar); }
.metricas span { font-size: 9.5px; color: var(--txt-dim); letter-spacing: .08em; text-transform: uppercase; }
.disclaimer { font-size: 10px; color: #3d5566; text-align: center; letter-spacing: .05em; }

/* ============================================================
   CREADOR
   ============================================================ */
.cab { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; border-bottom: 1px solid var(--linea); padding-bottom: 10px; }
.cab h2 { font-family: var(--disp); font-size: 24px; letter-spacing: .12em; margin: 0; color: var(--ambar); }

.crear-grid { display: grid; grid-template-columns: 220px 1fr; gap: 22px; }
@media (max-width: 720px) { .crear-grid { grid-template-columns: 1fr; } }

.holo-marco {
  border: 1px solid var(--cian-tenue); padding: 8px; background: #030a10;
  box-shadow: inset 0 0 30px rgba(58,214,255,.12), 0 0 22px rgba(58,214,255,.08);
  display: flex; justify-content: center;
}
.retrato { display: block; image-rendering: auto; }

.ap-controles { display: grid; gap: 6px; margin-top: 12px; }
.ap-controles label, .campo { display: block; font-size: 10px; letter-spacing: .14em; color: var(--txt-dim); text-transform: uppercase; }
select, input[type=text], input:not([type]) {
  width: 100%; margin-top: 3px;
  background: #061019; color: var(--txt); border: 1px solid var(--linea);
  font-family: var(--mono); font-size: 13px; padding: 7px 8px; border-radius: 2px;
  text-transform: none; letter-spacing: 0;
}
select:focus, input:focus { outline: none; border-color: var(--cian); box-shadow: 0 0 10px rgba(58,214,255,.2); }
.campo { margin-bottom: 14px; }
.fila { display: flex; gap: 6px; align-items: flex-start; }
.fila input { flex: 1; }
.nota { font-size: 11.5px; color: var(--txt); text-transform: none; letter-spacing: 0; margin: 6px 0 0; line-height: 1.45; }
.dim { color: var(--txt-dim); }

.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
.chip {
  font-family: var(--mono); font-size: 11px; padding: 5px 9px; cursor: pointer;
  background: #08141f; color: var(--txt-dim); border: 1px solid #16293a; border-radius: 2px;
  text-transform: none; letter-spacing: 0; transition: all .1s;
}
.chip:hover { color: var(--txt); border-color: var(--cian-tenue); }
.chip.on { background: linear-gradient(180deg,#123449,#0b2233); color: var(--cian); border-color: var(--cian); box-shadow: 0 0 10px rgba(58,214,255,.25); }
.acciones { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }

/* ============================================================
   JUEGO
   ============================================================ */
.hud { display: flex; flex-direction: column; height: 100dvh; width: 100%; position: relative; overflow: hidden; }

.topbar {
  display: flex; align-items: center; gap: 16px;
  padding: 10px 16px; background: linear-gradient(180deg,#0b1826,#070f19);
  border-bottom: 1px solid var(--linea);
}
.topbar > div { display: flex; flex-direction: column; line-height: 1.15; }
.topbar b { font-size: 14px; color: var(--txt); }
.topbar span { font-size: 9.5px; color: var(--txt-dim); letter-spacing: .1em; text-transform: uppercase; }
.tb-id { flex: 1; min-width: 0; }
.tb-id b { color: var(--ambar); }
.tb-edad b { color: var(--cian); font-size: 20px; }
.tb-cr b { color: var(--verde); }
.topbar .btn { margin-left: 6px; }

.cuerpo { display: grid; grid-template-columns: 286px 1fr; flex: 1; min-height: 0; overflow: hidden; }

.panel {
  background: var(--panel); border-right: 1px solid var(--linea);
  padding: 12px; overflow-y: auto; overscroll-behavior: contain; min-height: 0;
}
.holo-mini { display: flex; justify-content: center; margin-bottom: 10px; border: 1px solid #123044; padding: 5px; background: #030a10; }

.stats { display: grid; gap: 4px; margin-bottom: 12px; }
.stat, .cv-stat { display: grid; grid-template-columns: 74px 1fr 30px; align-items: center; gap: 6px; font-size: 10px; letter-spacing: .06em; color: var(--txt-dim); text-transform: uppercase; }
.stat b, .cv-stat b { text-align: right; color: var(--txt); font-size: 11px; }
.barra { height: 7px; background: #071119; border: 1px solid #14283a; position: relative; overflow: hidden; }
.barra i { display: block; height: 100%; background: linear-gradient(90deg, var(--cian-tenue), var(--cian)); box-shadow: 0 0 8px rgba(58,214,255,.5); }
.s-salud .barra i { background: linear-gradient(90deg,#2a7a4a,var(--verde)); box-shadow: 0 0 8px rgba(106,255,138,.4); }
.s-fuerza .barra i { background: linear-gradient(90deg,#6a4aa0,var(--morado)); box-shadow: 0 0 8px rgba(201,138,255,.4); }
.s-notoriedad .barra i { background: linear-gradient(90deg,#8a2a34,var(--rojo)); box-shadow: 0 0 8px rgba(255,77,94,.4); }
.s-reputacion .barra i { background: linear-gradient(90deg,#8a6a1a,var(--oro)); }

.align { margin-top: 8px; font-size: 10px; color: var(--txt-dim); text-transform: uppercase; letter-spacing: .06em; }
.align-barra { height: 8px; margin: 4px 0; background: linear-gradient(90deg, #4a1020, #1a1a2a, #103a4a); border: 1px solid #14283a; position: relative; }
.align-barra i { position: absolute; top: -2px; width: 3px; height: 12px; background: #fff; box-shadow: 0 0 8px #fff; transform: translateX(-50%); }
.align b { color: var(--txt); font-size: 11px; }

.ficha { border-top: 1px solid var(--linea); padding-top: 8px; margin-top: 8px; }
.ficha h4 { margin: 0 0 6px; font-size: 10px; letter-spacing: .16em; color: var(--cian-tenue); text-transform: uppercase; }
.f-row { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; padding: 2px 0; }
.f-row span { color: var(--txt-dim); }
.f-row b { color: var(--txt); text-align: right; }
.f-row.alerta b { color: var(--rojo); }

.rel { position: relative; padding: 3px 0 6px; border-bottom: 1px solid #0d1a26; }
.rel b { font-size: 11.5px; color: var(--txt); }
.rel span { font-size: 9.5px; color: var(--txt-dim); margin-left: 5px; text-transform: uppercase; letter-spacing: .06em; }
.rel i { display: block; height: 2px; margin-top: 3px; background: var(--cian); }
.rel i.neg { background: var(--rojo); }

/* ---------- consola ---------- */
.consola {
  padding: 16px 20px; overflow-y: auto; overscroll-behavior: contain; min-height: 0;
  background:
    linear-gradient(180deg, rgba(58,214,255,.03), transparent 120px),
    var(--bg2);
}
.año {
  margin: 16px 0 8px; display: flex; align-items: center; gap: 10px;
  font-size: 10px; letter-spacing: .26em; color: var(--ambar); text-transform: uppercase;
}
.año::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, #4a3a16, transparent); }
.año span { white-space: nowrap; }
.l { margin: 3px 0; font-size: 13.5px; line-height: 1.55; }
.l-eleccion { color: var(--cian); }
.l-res { color: var(--txt); }
.l-bien { color: var(--verde); }
.l-mal { color: var(--rojo); }
.l-cr { color: var(--oro); }
.l-rel { color: var(--morado); }
.l-viaje { color: var(--ambar); }
.l-nac { color: var(--ambar); font-size: 15px; }
.l-muerte { color: var(--rojo); font-size: 17px; letter-spacing: .1em; }

/* ---------- barra de acciones ---------- */
.acciones-bar {
  border-top: 1px solid var(--linea); background: linear-gradient(180deg,#081420,#050c14);
  padding: 10px 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.acts { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
.act {
  font-family: var(--mono); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: #0a1826; border: 1px solid #16293a; color: var(--txt-dim);
  padding: 6px 10px; border-radius: 2px; min-width: 68px; transition: all .1s;
}
.act i { font-style: normal; font-size: 16px; color: var(--cian-tenue); }
.act span { font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; }
.act:hover:not(.off) { border-color: var(--cian); color: var(--txt); box-shadow: 0 0 14px rgba(58,214,255,.2); }
.act:hover:not(.off) i { color: var(--cian); }
.avanzar { white-space: nowrap; }
.hint { flex: 1; font-size: 11px; color: var(--ambar); letter-spacing: .1em; text-transform: uppercase; }

/* ---------- evento ---------- */
.evento-overlay {
  position: fixed; inset: 0; z-index: 500;
  background: radial-gradient(circle at 50% 40%, rgba(4,10,16,.82), rgba(2,4,8,.96));
  display: flex; align-items: center; justify-content: center; padding: 20px;
  animation: fadeIn .18s ease;
}
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
.evento {
  width: 100%; max-width: 620px;
  background: linear-gradient(180deg, #0c1b2a, #08131f);
  border: 1px solid var(--cian-tenue);
  box-shadow: 0 0 40px rgba(58,214,255,.14), var(--sombra);
  padding: 22px; position: relative;
  animation: subir .2s ease;
  max-height: 88vh; overflow-y: auto;
}
@keyframes subir { from { transform: translateY(14px); opacity: 0 } to { transform: none; opacity: 1 } }
.evento::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--cian), transparent);
}
.ev-texto { font-size: 15.5px; line-height: 1.6; margin-bottom: 18px; color: #e6f4fb; }
.ev-texto b { color: var(--ambar); }
.scene-tag {
  display: inline-block; font-size: 10px; letter-spacing: .24em; color: var(--rojo);
  border: 1px solid #5a2028; padding: 2px 8px; margin-bottom: 8px; text-transform: uppercase;
}
.ev-ops { display: grid; gap: 7px; }
.op {
  font-family: var(--mono); text-align: left; cursor: pointer;
  background: #08141f; border: 1px solid #16293a; border-left: 3px solid var(--cian-tenue);
  color: var(--txt); padding: 10px 13px; transition: all .1s;
  display: block; width: 100%;
}
.op:hover { background: #10263a; border-left-color: var(--ambar); box-shadow: 0 0 16px rgba(58,214,255,.16); transform: translateX(2px); }
.op-t { display: block; font-size: 13.5px; }
.op-s { display: block; font-size: 11px; color: var(--txt-dim); margin-top: 2px; }

/* ---------- flash ---------- */
.flash {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); z-index: 9000;
  background: #12293c; border: 1px solid var(--cian-tenue); color: var(--txt);
  padding: 9px 16px; font-size: 12px; letter-spacing: .06em;
  box-shadow: 0 0 22px rgba(58,214,255,.22); transition: opacity .5s;
}
.flash.out { opacity: 0; }

/* ---------- modal ---------- */
.modal-overlay { position: fixed; inset: 0; z-index: 800; background: rgba(2,5,9,.86); display: flex; align-items: center; justify-content: center; padding: 18px; }
.modal { width: 100%; max-width: 700px; max-height: 88vh; overflow-y: auto; background: var(--panel2); border: 1px solid var(--cian-tenue); box-shadow: var(--sombra); }
.modal-cab { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--linea); position: sticky; top: 0; background: var(--panel2); }
.modal-cab h3 { margin: 0; font-family: var(--disp); letter-spacing: .14em; color: var(--ambar); font-size: 18px; }
.modal-cuerpo { padding: 16px; font-size: 13.5px; }
.modal-cuerpo p { line-height: 1.6; }
.menu-pausa { display: grid; gap: 8px; }

/* ============================================================
   TARJETA DE VIDA
   ============================================================ */
.fin-cab { text-align: center; margin-bottom: 18px; }
.fin-cab h2 { font-family: var(--disp); font-size: 30px; letter-spacing: .14em; color: var(--rojo); margin: 0 0 4px; text-shadow: 0 0 20px rgba(255,77,94,.3); }
.epitafio { font-size: 13px; color: var(--txt-dim); font-style: italic; margin: 0; }

.card-vida {
  border: 1px solid var(--linea); background: linear-gradient(180deg, #0a1622, #070f18);
  padding: 20px; position: relative;
}
.card-vida::before { content: ""; position: absolute; inset: 5px; border: 1px solid rgba(216,184,74,.16); pointer-events: none; }
.cv-head { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
.cv-retrato { border: 1px solid var(--cian-tenue); padding: 5px; background: #030a10; flex-shrink: 0; }
.cv-id { flex: 1; min-width: 200px; }
.cv-id h2 { font-family: var(--disp); font-size: 30px; letter-spacing: .06em; margin: 0 0 2px; color: var(--ambar); }
.cv-sub { margin: 1px 0; font-size: 12px; color: var(--txt-dim); }
.cv-estado { margin: 8px 0 0; font-size: 13px; }
.cv-estado.muerto { color: var(--rojo); }
.cv-estado.vivo { color: var(--verde); }

.cv-titulos { margin: 14px 0 4px; display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-block; font-size: 10.5px; letter-spacing: .08em; padding: 3px 8px; border: 1px solid var(--linea); color: var(--txt); background: #08141f; text-transform: uppercase; }
.tag.oro { border-color: var(--oro); color: var(--oro); box-shadow: 0 0 12px rgba(216,184,74,.15); }

.cv-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px,1fr)); gap: 5px 18px; margin: 16px 0; padding: 14px 0; border-top: 1px solid var(--linea); border-bottom: 1px solid var(--linea); }
.cv-linea { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.cv-seccion { margin-top: 14px; }
.cv-seccion h3 { font-size: 10px; letter-spacing: .22em; color: var(--cian-tenue); text-transform: uppercase; margin: 0 0 6px; }
.cv-seccion p { margin: 0; font-size: 12.5px; }
.cv-rel { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap: 3px; }
.cv-rel li { font-size: 12.5px; }
.cv-rel .rt { color: var(--txt-dim); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; }
.cv-rel .af.pos { color: var(--verde); }
.cv-rel .af.neg { color: var(--rojo); }
.cv-hitos { list-style: none; padding: 0; margin: 0; }
.cv-hitos li { font-size: 13px; padding: 3px 0; border-bottom: 1px solid #0c1824; }
.cv-hitos .edad { display: inline-block; min-width: 34px; color: var(--ambar); font-size: 11px; }
.cv-pie { margin-top: 16px; padding-top: 10px; border-top: 1px solid var(--linea); font-size: 10px; color: #3d5566; letter-spacing: .1em; text-align: center; text-transform: uppercase; }
.cv-pie code { color: var(--cian-tenue); }

.fin-acciones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; justify-content: center; }
.zona-link { margin-top: 14px; }
.zona-link .ok { color: var(--verde); font-size: 12px; }
.link-input { width: 100%; font-size: 11px; }
.txt-resumen { background: #061019; border: 1px solid var(--linea); padding: 12px; font-size: 11px; overflow-x: auto; color: var(--txt-dim); }

body.solo-tarjeta .pantalla { padding: 30px 14px; }

/* scrollbars */
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: #050c13; }
::-webkit-scrollbar-thumb { background: #16354a; border: 1px solid #0a1a26; }
::-webkit-scrollbar-thumb:hover { background: var(--cian-tenue); }

/* ============================================================
   COMPONENTES NUEVOS
   ============================================================ */

/* micro-barras siempre visibles arriba */

/* ============================================================

   ============================================================ */
:root {

  --cielo:  #0d2438;
  --suelo:  #04070c;
  --niebla: #1d7fa0;
}

body.en-juego::before {
  background:
    radial-gradient(1px 1px at 12% 22%, #cfe8f5 50%, transparent 51%),
    radial-gradient(1px 1px at 68% 14%, #9fd4ff 50%, transparent 51%),
    radial-gradient(1px 1px at 34% 71%, #ffffff 50%, transparent 51%),
    radial-gradient(1px 1px at 82% 63%, #ffd9a0 50%, transparent 51%),
    radial-gradient(1600px 800px at 50% -12%, var(--cielo) 0%, transparent 72%),
    linear-gradient(var(--suelo), #05080e);
  transition: background 1.2s ease;
}

.bioma-punto {
  display: inline-block; width: 7px; height: 7px; margin-right: 6px;
  background: var(--acento); border-radius: 50%;

  animation: latido 3s ease-in-out infinite;
}
@keyframes latido { 0%,100% { opacity: 1 } 50% { opacity: .45 } }

}

  position: relative;
  background:
    linear-gradient(180deg, color-mix(in srgb, var(--cielo) 55%, #0b1826), #060e18);
  box-shadow: inset 0 -1px 0 color-mix(in srgb, var(--acento) 25%, transparent);
}
.topbar::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--acento), transparent);
  opacity: .5;
}
.tb-mundo b { color: var(--acento) !important; }

.tb-acc { align-items: flex-start; }
.tb-acc b { display: flex; gap: 4px; align-items: center; height: 14px; }
.pip {
  display: block; width: 9px; height: 9px; border: 1px solid var(--niebla);
  transform: rotate(45deg); background: transparent; transition: all .2s;
}
.pip.on { background: var(--acento); border-color: var(--acento); box-shadow: 0 0 8px var(--acento); }

.avanzar em { font-style: normal; opacity: .6; font-size: 11px; }

/* esquinas de marco: el detalle que hace que parezca un aparato */
.panel, .consola { position: relative; }
.evento::after, .vitrina::after {
  content: ""; position: absolute; inset: 6px; pointer-events: none;
  border: 1px solid color-mix(in srgb, var(--acento) 18%, transparent);
  clip-path: polygon(0 0, 14px 0, 14px 1px, calc(100% - 14px) 1px, calc(100% - 14px) 0, 100% 0,

                     100% 100%, calc(100% - 14px) 100%, calc(100% - 14px) calc(100% - 1px), 14px calc(100% - 1px),

<script>
/* ===== src/rng.js ===== */
/* ============================================================
   HOLOVIDA :: núcleo aleatorio determinista
   Todo el juego usa una única semilla -> vidas reproducibles.
   ============================================================ */
(function (global) {
  'use strict';

  function xmur3(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return function () {
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      h ^= h >>> 16;
      return h >>> 0;
    };
  }

  function mulberry32(a) {
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function RNG(seed) {
    this.seedStr = String(seed == null ? Date.now() + ':' + Math.random() : seed);
    const s = xmur3(this.seedStr);
    this._n = mulberry32(s());
    this.calls = 0;
  }

  RNG.prototype.next = function () {
    this.calls++;
    return this._n();
  };
  /** float en [a,b) */
  RNG.prototype.range = function (a, b) {
    return a + this.next() * (b - a);
  };
  /** entero en [a,b] inclusive */
  RNG.prototype.int = function (a, b) {
    return Math.floor(this.range(a, b + 1));
  };
  /** true con probabilidad p */
  RNG.prototype.chance = function (p) {
    return this.next() < p;
  };
  RNG.prototype.pick = function (arr) {
    if (!arr || !arr.length) return undefined;
    return arr[Math.floor(this.next() * arr.length)];
  };
  RNG.prototype.pickN = function (arr, n) {
    const copy = arr.slice();
    const out = [];
    while (out.length < n && copy.length) {
      out.push(copy.splice(Math.floor(this.next() * copy.length), 1)[0]);
    }
    return out;
  };
  RNG.prototype.shuffle = function (arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(this.next() * (i + 1));
      const t = a[i];
      a[i] = a[j];
      a[j] = t;
    }
    return a;
  };
  /** elección ponderada: items con .w (peso), por defecto 1 */
  RNG.prototype.weighted = function (items, wf) {
    const f = wf || function (o) { return o.w == null ? 1 : o.w; };
    let total = 0;
    for (let i = 0; i < items.length; i++) total += Math.max(0, f(items[i]));
    if (total <= 0) return this.pick(items);
    let r = this.next() * total;
    for (let i = 0; i < items.length; i++) {
      r -= Math.max(0, f(items[i]));
      if (r <= 0) return items[i];
    }
    return items[items.length - 1];
  };
  /** campana: valor central con dispersión, recortado */
  RNG.prototype.bell = function (min, max, rolls) {
    const n = rolls || 3;
    let s = 0;
    for (let i = 0; i < n; i++) s += this.next();
    return Math.round(min + (s / n) * (max - min));
  };

  // --- utilidades generales -------------------------------------------------
  const U = {
    clamp: function (v, a, b) { return v < a ? a : v > b ? b : v; },
    /** formatea créditos: 1234567 -> 1.234.567 */
    cr: function (n) {
      const neg = n < 0;
      const s = Math.abs(Math.round(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      return (neg ? '−' : '') + s + ' cr';
    },
    num: function (n) {
      return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    },
    esc: function (s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    },
    /** rellena {slots} en una plantilla */
    fill: function (tpl, slots) {
      return String(tpl).replace(/\{(\w+)\}/g, function (m, k) {
        return slots && slots[k] != null ? slots[k] : m;
      });
    },
    titleCase: function (s) {
      return String(s).charAt(0).toUpperCase() + String(s).slice(1);
    }
  };

  // --- compresión LZW -> base64url (para enlaces de resumen) ----------------
  function lzwEncode(str) {
    const dict = new Map();
    const data = String(str);
    let out = [];
    let phrase = data[0];
    let code = 256;
    for (let i = 1; i < data.length; i++) {
      const c = data[i];
      if (dict.has(phrase + c)) {
        phrase += c;
      } else {
        out.push(phrase.length > 1 ? dict.get(phrase) : phrase.charCodeAt(0));
        dict.set(phrase + c, code++);
        phrase = c;
      }
    }
    if (phrase !== '') out.push(phrase.length > 1 ? dict.get(phrase) : phrase.charCodeAt(0));
    return out;
  }

  function lzwDecode(codes) {
    const dict = {};
    let currChar = String.fromCharCode(codes[0]);
    let oldPhrase = currChar;
    const out = [currChar];
    let code = 256;
    let phrase;
    for (let i = 1; i < codes.length; i++) {
      const currCode = codes[i];
      if (currCode < 256) phrase = String.fromCharCode(currCode);
      else phrase = dict[currCode] ? dict[currCode] : oldPhrase + currChar;
      out.push(phrase);
      currChar = phrase.charAt(0);
      dict[code++] = oldPhrase + currChar;
      oldPhrase = phrase;
    }
    return out.join('');
  }

  const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';

  function packCodes(codes) {
    // cada código cabe en 20 bits (suficiente para nuestros textos)
    let bits = '';
    for (let i = 0; i < codes.length; i++) {
      bits += codes[i].toString(2).padStart(20, '0');
    }
    while (bits.length % 6) bits += '0';
    let out = '';
    for (let i = 0; i < bits.length; i += 6) out += B64[parseInt(bits.substr(i, 6), 2)];
    return out;
  }

  function unpackCodes(s) {
    let bits = '';
    for (let i = 0; i < s.length; i++) {
      const v = B64.indexOf(s[i]);
      if (v < 0) continue;
      bits += v.toString(2).padStart(6, '0');
    }
    const codes = [];
    for (let i = 0; i + 20 <= bits.length; i += 20) {
      codes.push(parseInt(bits.substr(i, 20), 2));
    }
    return codes;
  }

  U.pack = function (obj) {
    try {
      const json = JSON.stringify(obj);
      // escapa a latin1 seguro para LZW por code point
      const safe = encodeURIComponent(json);
      return packCodes(lzwEncode(safe));
    } catch (e) { return ''; }
  };

  U.unpack = function (str) {
    try {
      const codes = unpackCodes(str);
      if (!codes.length) return null;
      const safe = lzwDecode(codes);
      return JSON.parse(decodeURIComponent(safe));
    } catch (e) { return null; }
  };

  global.SW = global.SW || {};
  global.SW.RNG = RNG;
  global.SW.U = U;
})(window);

    const o = opts || {};
    const sp = S[nombre] || S.reliquia;
    const esc = o.escala || 6;
    const cv = document.createElement('canvas');
    cv.width = sp.w * esc;
    cv.height = sp.h * esc;
    cv.className = 'sprite';
    const cx = cv.getContext('2d');
    cx.imageSmoothingEnabled = false;

    if (o.fondo) { cx.fillStyle = o.fondo; cx.fillRect(0, 0, cv.width, cv.height); }

    const din = o.dinamico || '#c8d4e0';
    for (let y = 0; y < sp.px.length; y++) {
      const fila = sp.px[y];
      for (let x = 0; x < fila.length; x++) {
        const ch = fila[x];
        if (ch === '.') continue;
        const color = ch === '#' ? din : sp.pal[ch];
        if (!color) continue;
        cx.fillStyle = color;
        cx.fillRect(x * esc, y * esc, esc, esc);
      }
    }
    return cv;
  };

/* ============================================================
   HOLOVIDA :: equipo
   Los objetos dejan de ser una lista y pasan a importar: si no
   tienes un bláster no puedes batirte en un duelo de pistolas,
   y la armadura que llevas encima resta daño de verdad.
   ============================================================ */
(function (global) {
  'use strict';
  const SW = (global.SW = global.SW || {});

  /* Categorías de uso. Un objeto puede tener varias. */
  SW.CAT = {
    fuego: 'arma_fuego',      // bláster, rifle: habilita duelos de pistolas
    filo: 'arma_filo',        // vibrohoja, cuchillo
    sable: 'sable',           // sable de luz
    peto: 'armadura',
    util: 'herramienta',
    nave: 'nave'
  };

  /* Ficha de combate de cada objeto: qué habilita y cuánto suma.
     Lo que no aparezca aquí es decorativo o mercancía. */
  SW.FICHA_OBJETO = {
    'bláster DL-44 modificado':            { cat: 'fuego', atk: 10, precision: 8 },
    'rifle de francotirador Verpine':      { cat: 'fuego', atk: 14, precision: 14, torpe: true },
    'rifle bláster DC-15A':                { cat: 'fuego', atk: 11, precision: 9 },
    'pistola de aturdimiento reglamentaria': { cat: 'fuego', atk: 4, precision: 5, noLetal: true },
    'lanzacohetes de hombro':              { cat: 'fuego', atk: 20, precision: -6, torpe: true },
    'ballesta wookiee':                    { cat: 'fuego', atk: 13, precision: 6 },
    'arco tusken':                         { cat: 'fuego', atk: 7, precision: 7 },
    'lanzallamas de muñeca':               { cat: 'fuego', atk: 12, precision: 2 },
    'vibrohoja de Iridonia':               { cat: 'filo', atk: 8 },
    'cuchillo de vibro-obsidiana':         { cat: 'filo', atk: 10 },
    'bastón eléctrico gamorreano':         { cat: 'filo', atk: 7 },
    'látigo eléctrico de capataz':         { cat: 'filo', atk: 6 },
    'armadura de beskar (una pieza)':      { cat: 'peto', def: 16 },
    'placas de armadura clon repintadas':  { cat: 'peto', def: 9 },
    'chaleco reflectante barato':          { cat: 'peto', def: 4 },
    'casco con visor táctico':             { cat: 'peto', def: 5, precision: 6 },
    'escudo de energía personal':          { cat: 'peto', def: 14 },
    'capa térmica de Hoth':                { cat: 'peto', def: 2 },
    'jetpack mandaloriano':                { cat: 'util', esquiva: 8 },
    'spike de slicer militar':             { cat: 'util', intelecto: 6 },
    'macrobinoculares con registro':       { cat: 'util', precision: 4 },
    'kit de médico de campaña':            { cat: 'util', cura: 3 },
    'droide médico 2-1B reparado':         { cat: 'util', cura: 5 }
  };

  SW.fichaObjeto = function (nombre) { return SW.FICHA_OBJETO[nombre] || null; };

  /** ¿lleva encima algo de esa categoría? */
  SW.tieneCat = function (s, cat) {
    if (cat === 'sable') return !!s.sable;
    for (let i = 0; i < s.objetos.length; i++) {
      const f = SW.fichaObjeto(s.objetos[i]);
      if (f && f.cat === cat) return true;
    }
    return false;
  };
  SW.tieneArmaFuego = function (s) { return SW.tieneCat(s, 'fuego'); };
  SW.armaDeMano = function (s) { return !!s.sable || SW.tieneCat(s, 'filo') || SW.tieneCat(s, 'fuego'); };

  /** El mejor objeto que tengas de una categoría */
  SW.mejorDe = function (s, cat) {
    let mejor = null, mejorV = -1;
    for (let i = 0; i < s.objetos.length; i++) {
      const f = SW.fichaObjeto(s.objetos[i]);
      if (!f || f.cat !== cat) continue;
      const v = (f.atk || 0) + (f.def || 0) + (f.precision || 0);
      if (v > mejorV) { mejorV = v; mejor = { n: s.objetos[i], f: f }; }
    }
    return mejor;
  };

  /** Bonos totales que aporta el equipo que llevas */
  SW.bonosEquipo = function (s) {
    const b = { atk: 0, def: 0, precision: 0, esquiva: 0, cura: 0 };
    const vistos = {};
    for (let i = 0; i < s.objetos.length; i++) {
      const n = s.objetos[i];
      const f = SW.fichaObjeto(n);
      if (!f) continue;
      // solo cuenta el mejor de cada categoría de arma; las utilidades suman todas
      if (f.cat === 'fuego' || f.cat === 'filo' || f.cat === 'peto') {
        if (vistos[f.cat]) continue;
        vistos[f.cat] = true;
        const mejor = SW.mejorDe(s, f.cat);
        if (mejor) {
          b.atk += mejor.f.atk || 0;
          b.def += mejor.f.def || 0;
          b.precision += mejor.f.precision || 0;
        }
        continue;
      }
      b.atk += f.atk || 0;
      b.def += f.def || 0;
      b.precision += f.precision || 0;
      b.esquiva += f.esquiva || 0;
      b.cura += f.cura || 0;
    }
    if (s.sable) { b.atk += 16; b.def += 6; }
    return b;
  };

  /* ============================================================
     CONSEGUIR ARMAS: comprar, robar, ganar, fabricar, heredar
     ============================================================ */
  SW.GEN = SW.GEN || {};

  SW.GEN.armeria = function (rng, s) {
    const armas = Object.keys(SW.FICHA_OBJETO).filter(function (n) {
      const f = SW.FICHA_OBJETO[n];
      return (f.cat === 'fuego' || f.cat === 'filo' || f.cat === 'peto') && s.objetos.indexOf(n) < 0;
    });
    const stock = rng.pickN(armas, 4);
    const c = stock.map(function (n) {
      const base = (SW.OBJETOS.filter(function (o) { return o.n === n; })[0] || { p: 2000 }).p;
      const precio = Math.round(base * (0.85 + rng.next() * 0.4));
      const f = SW.FICHA_OBJETO[n];
      const puede = s.stats.creditos >= precio;
      const etq = f.cat === 'fuego' ? 'arma de fuego' : f.cat === 'filo' ? 'cuerpo a cuerpo' : 'protección';
      return {
        t: (puede ? 'Comprar ' : '✕ ') + n + ' — ' + SW.U.cr(precio),
        sub: etq + (f.atk ? ' · +' + f.atk + ' ataque' : '') + (f.def ? ' · +' + f.def + ' defensa' : '') + (puede ? '' : ' · no te llega'),
        bloqueada: !puede,
        fx: puede ? { creditos: -precio } : {},
        darItem: puede ? n : null
      };
    });

    /* robar: barato en créditos, caro en todo lo demás */
    const objetivo = rng.pick(stock);
    c.push({
      t: 'Robar ' + objetivo + ' del mostrador',
      sub: 'gratis si sale bien',
      r: [
        { p: 0.45, t: 'Sales con ello bajo la chaqueta.', fx: { destreza: 8, notoriedad: 10, alineamiento: -10 }, darItem: objetivo },
        { p: 0.35, t: 'El armero te ve y te echa a patadas.', fx: { reputacion: -10, notoriedad: 8 } },
        { p: 0.20, t: 'El armero te ve y tiene su propio surtido cargado.', fx: { salud: -20, notoriedad: 14 } }
      ]
    });
    if (s.habilidades.indexOf('armero') >= 0) {
      c.push({ t: 'Fabricarte una tú mismo', sub: 'sabes hacerlo', fx: { creditos: -1200, intelecto: 6 }, darItem: rng.pick(stock) });
    }
    c.push({ t: '◂ Salir de la armería', volver: true });
    return { id: 'menu_armeria', gen: true, esMenu: true, t: 'ARMERÍA de ' + s.mundo + ' — tienes ' + SW.U.cr(s.stats.creditos), c: c };
  };

})(window);

    let pool = SW.CARRERAS.filter(function (c) {

      if (c.esp && c.esp.indexOf(s.especie) < 0) return false;

      for (const k in r) if ((s.stats[k] || 0) < r[k]) return false;
